name: LinkedIn feed (for Zapier)
on:
  schedule: [{ cron: "7,37 * * * *" }]
  push:
    branches: [main]
    paths: ["linkedin/**", "poster/linkedin_feed.py"]
  workflow_dispatch:
concurrency: { group: linkedin-feed, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: python poster/linkedin_feed.py
